<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>QR Generátor</title>
  <meta name="description" content="Jednoduchá offline aplikace pro tvorbu QR kódů z textu, odkazu, Wi-Fi, kontaktu, e-mailu, SMS, telefonu, události i s vlastním logem.">
  <meta name="theme-color" content="#121821">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR Generátor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="brand">📱 QR Generátor</span>
      <span class="spacer"></span>
      <span class="offline-pill" id="offlinePill"><span class="d"></span><span class="txt">Offline připraveno</span></span>
    </header>

    <main class="wrap">
      <nav class="types" id="types" aria-label="Typ QR kódu"></nav>

      <section class="card" id="formCard">
        <form id="qrForm" autocomplete="off"></form>
      </section>

      <section class="card preview-card">
        <div class="preview-wrap">
          <canvas id="qrCanvas" width="1024" height="1024"></canvas>
          <p class="empty-hint" id="emptyHint">Vyplň pole výše a QR kód se zobrazí tady.</p>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="btnDownload" disabled>⬇️ Stáhnout do telefonu</button>
          <button type="button" class="btn" id="btnShare" disabled>📤 Sdílet</button>
          <button type="button" class="btn ghost" id="btnCopy" disabled>📋 Kopírovat obrázek</button>
        </div>
        <p class="toast" id="toast" role="status" aria-live="polite"></p>
      </section>

      <details class="card appearance">
        <summary>🎨 Vzhled a nastavení</summary>
        <div class="appearance-body">
          <div class="field-row">
            <label class="field">
              <span>Barva kódu</span>
              <input type="color" id="fgColor" value="#0b1220">
            </label>
            <label class="field">
              <span>Barva pozadí</span>
              <input type="color" id="bgColor" value="#ffffff">
            </label>
          </div>

          <label class="field">
            <span>Úroveň korekce chyb</span>
            <select id="ecLevel">
              <option value="L">L — nízká (rychlejší, méně hustý kód)</option>
              <option value="M" selected>M — střední (doporučeno)</option>
              <option value="Q">Q — vysoká</option>
              <option value="H">H — nejvyšší (nutná pro logo uprostřed)</option>
            </select>
          </label>

          <label class="field">
            <span>Logo / obrázek uprostřed (nepovinné)</span>
            <input type="file" id="logoInput" accept="image/*">
          </label>

          <label class="field" id="logoScaleRow" hidden>
            <span>Velikost loga</span>
            <input type="range" id="logoScale" min="12" max="30" value="20">
          </label>

          <button type="button" class="btn ghost small" id="btnRemoveLogo" hidden>✕ Odebrat logo</button>
        </div>
      </details>

      <section class="card history" id="historySection" hidden>
        <h2>Poslední QR kódy</h2>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>

    <footer class="foot">
      <p>Vše se generuje přímo v telefonu — žádná data neopouští zařízení. Funguje i offline.</p>
    </footer>
  </div>

  <script src="js/qrcode-lib.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
