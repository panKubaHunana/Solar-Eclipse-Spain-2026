name = "hourly-chime"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Spouští se každou celou hodinu (UTC) — díky celočíselnému posunu času
# ve Španělsku/ČR (UTC+1/+2) to vychází na celou hodinu i tam.
[triggers]
crons = ["0 * * * *"]

# Vytvoř KV namespace příkazem:
#   npx wrangler kv namespace create SUBS
# a vlož vygenerované "id" sem místo REPLACE_WITH_KV_ID (viz README.md).
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

